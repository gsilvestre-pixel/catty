<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de Inspecciones</title>
<meta name="theme-color" content="#16506B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --ground:#EDF1F3; --surface:#FFFFFF; --surface-2:#F4F7F8; --surface-3:#E8EEF0;
  --line:#D5DEE2; --line-soft:#E5EBEE;
  --ink:#131B20; --ink-2:#4A5860; --ink-3:#71828B;
  --accent:#16506B; --accent-ink:#0E3B50; --accent-soft:#E0EBF1;
  --hoy:#B4551F; --hoy-soft:#FBEADF;
  --shadow:0 1px 2px rgba(19,27,32,.06), 0 8px 24px rgba(19,27,32,.07);
  --radius:10px; --fila:52px;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sans:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Archivo", "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1519; --surface:#161E23; --surface-2:#1B252B; --surface-3:#222E35;
    --line:#2B373E; --line-soft:#222D34;
    --ink:#E7EDF0; --ink-2:#AEBCC3; --ink-3:#87979F;
    --accent:#6FAECC; --accent-ink:#9CCBE3; --accent-soft:#16303C;
    --hoy:#E0956A; --hoy-soft:#2E1E14;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1519; --surface:#161E23; --surface-2:#1B252B; --surface-3:#222E35;
  --line:#2B373E; --line-soft:#222D34;
  --ink:#E7EDF0; --ink-2:#AEBCC3; --ink-3:#87979F;
  --accent:#6FAECC; --accent-ink:#9CCBE3; --accent-soft:#16303C;
  --hoy:#E0956A; --hoy-soft:#2E1E14;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display); margin:0; letter-spacing:-.01em; text-wrap:balance}
button, input, select, textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:5px}
.wrap{max-width:1240px; margin:0 auto; padding-inline:16px}

/* ---------- barra superior ---------- */
.topbar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-block:11px}
.marca{margin-right:auto; min-width:0}
.marca .sub{display:block; font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
.marca h1{font-size:19px; font-weight:700}
.btn{border:1px solid var(--line); background:var(--surface); padding:7px 12px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.primario{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.primario{color:#0F1519}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primario{color:#0F1519}}
.btn.chico{padding:4px 9px; font-size:12.5px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.flechas{display:flex; gap:4px}
.flechas .btn{width:34px; padding:6px 0; text-align:center; font-size:16px; line-height:1}
.vistas{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px}
.vistas button{border:none; background:none; padding:5px 13px; border-radius:7px; font-size:13.5px; font-weight:600; color:var(--ink-3); cursor:pointer}
.vistas button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
select, input[type="text"], input[type="date"], input[type="time"], textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:14px;
}
#filtro-persona{max-width:210px; font-weight:600}
#filtro-persona.activo{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.btn.activo{color:var(--accent-ink); background:var(--accent-soft); border-color:var(--accent)}

main{padding-bottom:56px}
.aviso{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface-2); font-size:13.5px; color:var(--ink-2); margin-top:14px}
.aviso b{color:var(--ink)}
.aviso.demo{border-color:color-mix(in srgb, var(--hoy) 45%, var(--line)); background:var(--hoy-soft); color:var(--hoy)}
.aviso .btn{margin-left:auto}

/* ---------- lienzo del calendario ---------- */
.lienzo{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-top:14px; overflow:hidden}

/* vista mes */
.dow{display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line)}
.dow span{padding:8px 6px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:600; text-align:center}
.mes{display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(112px,1fr)}
.celda{border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:5px 5px 6px; display:flex; flex-direction:column; gap:3px; min-width:0; cursor:pointer}
.celda:nth-child(7n){border-right:none}
.celda:hover{background:var(--surface-2)}
.celda.otro{background:var(--surface-2)}
.celda.otro .num{color:var(--ink-3); opacity:.6}
.num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-2); align-self:flex-start; padding:2px 6px; border-radius:99px; border:none; background:none; cursor:pointer}
.num:hover{background:var(--surface-3)}
.celda.hoy .num{background:var(--hoy); color:#fff; font-weight:500}
:root[data-theme="dark"] .celda.hoy .num{color:#0F1519}
.ev{
  display:block; width:100%; text-align:left; border:none; cursor:pointer;
  background:var(--accent-soft); color:var(--accent-ink); border-left:3px solid var(--accent);
  border-radius:4px; padding:2px 5px; font-size:11.5px; line-height:1.35;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ev:hover{filter:brightness(.97)}
.ev b{font-family:var(--mono); font-weight:500; font-size:10.5px; margin-right:4px}
.mas{font-size:10.5px; color:var(--ink-3); font-family:var(--mono); padding-left:4px; text-align:left; background:none; border:none; cursor:pointer}

/* vistas semana y día */
.grid-scroll{overflow-x:auto}
.cabecera{display:grid; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
.cabecera .hueco{border-right:1px solid var(--line-soft)}
.cab-dia{padding:7px 4px; text-align:center; border-right:1px solid var(--line-soft); cursor:pointer}
.cab-dia:last-child{border-right:none}
.cab-dia .d{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:600}
.cab-dia .n{font-family:var(--mono); font-size:19px; color:var(--ink); display:inline-block; min-width:31px; padding:2px 0; border-radius:99px; margin-top:1px}
.cab-dia.hoy .n{background:var(--hoy); color:#fff}
:root[data-theme="dark"] .cab-dia.hoy .n{color:#0F1519}
.horas{display:grid; position:relative}
.col-horas{border-right:1px solid var(--line-soft)}
.hora-et{height:var(--fila); font-family:var(--mono); font-size:10.5px; color:var(--ink-3); text-align:right; padding:3px 6px 0 0}
.col-dia{border-right:1px solid var(--line-soft); position:relative}
.col-dia:last-child{border-right:none}
.franja{height:var(--fila); border-bottom:1px solid var(--line-soft); cursor:pointer}
.franja:hover{background:var(--surface-2)}
.col-dia.finde{background:var(--surface-2)}
.bloque{
  position:absolute; left:2px; right:2px; border-radius:6px; padding:3px 6px; cursor:pointer;
  background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-left:3px solid var(--accent); color:var(--accent-ink); overflow:hidden; text-align:left;
}
.bloque:hover{filter:brightness(.97)}
.bloque .h{font-family:var(--mono); font-size:10.5px; font-weight:500; opacity:.85}
.bloque .e{font-size:12.5px; font-weight:600; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dia-detalle .bloque .e{white-space:normal}
.bloque .p{font-size:11px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ahora{position:absolute; left:0; right:0; height:2px; background:var(--hoy); z-index:3; pointer-events:none}
.ahora::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--hoy)}

/* vista día: detalle más completo */
.dia-detalle .bloque{padding:4px 8px}
.dia-detalle .bloque .h{margin-right:5px}
.dia-detalle .bloque .p{line-height:1.3}
.vacio{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:14px}

/* ---------- personas ---------- */
.persona{font-size:11.5px; font-weight:600; color:var(--ink-2); background:var(--surface-3); border-radius:99px; padding:1px 8px; white-space:nowrap}
.chips-in{display:flex; flex-wrap:wrap; gap:5px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:5px 6px; background:var(--surface)}
.chips-in:focus-within{border-color:var(--accent)}
.chips-in input{border:none; outline:none; background:none; flex:1; min-width:120px; padding:2px}
.chips-in .persona{display:inline-flex; align-items:center; gap:2px; font-size:12.5px; padding:2px 4px 2px 9px}
.chips-in .quita{border:none; background:none; cursor:pointer; font-size:14px; line-height:1; padding:0 4px; border-radius:99px}
.chips-in .quita:hover{background:var(--line)}

/* ---------- diálogo ---------- */
dialog{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:0; width:min(520px, calc(100vw - 32px)); box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,20,.45)}
dialog header{padding:14px 16px; border-bottom:1px solid var(--line-soft)}
dialog header h2{font-size:16px; font-weight:700}
dialog .cuerpo{padding:16px; display:grid; gap:12px}
dialog footer{padding:12px 16px; border-top:1px solid var(--line-soft); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
dialog footer .izq{margin-right:auto}
.campo{display:flex; flex-direction:column; gap:4px}
.campo label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600}
.fila{display:grid; grid-template-columns:1fr 1fr; gap:12px}
textarea{resize:vertical; min-height:64px; font-family:var(--sans)}
.pie{padding:18px 0 0; font-size:12.5px; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap}

@media (max-width:760px){
  .wrap{padding-inline:12px}
  .topbar .wrap{gap:7px; padding-block:9px}
  .marca{width:100%; margin-right:0}
  .marca h1{font-size:17px}
  .btn{padding:9px 13px}
  .flechas .btn{width:40px}
  #filtro-persona{flex:1 1 140px; max-width:none}
  #btn-edicion, #btn-nueva{flex:1 1 auto}
  .mes{grid-auto-rows:minmax(74px,1fr)}
  .celda{padding:3px}
  .ev{font-size:10.5px; padding:1px 4px}
  .ev b{display:block; margin:0}
  .cabecera, .horas{min-width:560px}
  .fila{grid-template-columns:1fr}
  dialog{width:calc(100vw - 20px)}
}
@media (max-width:420px){
  .cab-dia .n{font-size:16px; min-width:26px}
  .dow span{font-size:10px}
}
@media (pointer:coarse){ :root{--fila:58px} }
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="marca">
      <span class="sub">Agenda de inspecciones</span>
      <h1 id="rotulo">—</h1>
    </div>
    <button class="btn" id="btn-hoy">Hoy</button>
    <div class="flechas">
      <button class="btn" id="btn-ant" aria-label="Anterior">‹</button>
      <button class="btn" id="btn-sig" aria-label="Siguiente">›</button>
    </div>
    <div class="vistas" role="group" aria-label="Vista">
      <button data-vista="mes" aria-pressed="true">Mes</button>
      <button data-vista="semana" aria-pressed="false">Semana</button>
      <button data-vista="dia" aria-pressed="false">Día</button>
    </div>
    <select id="filtro-persona" aria-label="Filtrar por persona"><option value="">Todas las personas</option></select>
    <button class="btn" id="btn-edicion">Activar edición</button>
    <button class="btn primario" id="btn-nueva">+ Visita</button>
  </div>
</header>

<main class="wrap">
  <div id="aviso"></div>
  <section class="lienzo" id="lienzo"></section>
  <p class="pie"><span id="pie-fuente">—</span><span id="pie-cuenta"></span></p>
</main>

<datalist id="lista-entidades"></datalist>
<datalist id="lista-personas"></datalist>

<dialog id="dlg">
  <form method="dialog" id="form">
    <header><h2 id="dlg-titulo">Nueva visita</h2></header>
    <div class="cuerpo">
      <div class="campo">
        <label for="f-entidad">Entidad</label>
        <input type="text" id="f-entidad" list="lista-entidades" required maxlength="160" placeholder="Nombre de la entidad">
      </div>
      <div class="fila">
        <div class="campo">
          <label for="f-fecha">Fecha</label>
          <input type="date" id="f-fecha" required>
        </div>
        <div class="campo">
          <label for="f-hora">Hora</label>
          <input type="time" id="f-hora" required step="900">
        </div>
      </div>
      <div class="campo">
        <label for="f-personas-in">Personas que harán la inspección</label>
        <div class="chips-in" id="f-personas"><input type="text" id="f-personas-in" list="lista-personas" placeholder="Nombre + Enter"></div>
      </div>
      <div class="campo">
        <label for="f-obs">Observaciones</label>
        <textarea id="f-obs" maxlength="500" placeholder="Opcional"></textarea>
      </div>
    </div>
    <footer>
      <button type="button" class="btn izq" id="f-eliminar">Eliminar</button>
      <button type="button" class="btn" id="f-cancelar">Cancelar</button>
      <button type="submit" class="btn primario">Guardar</button>
    </footer>
  </form>
</dialog>

<script>
/* =====================================================================
   Agenda de inspecciones — programación de visitas
   Cada visita: entidad, fecha, hora, personas y observaciones.
   ===================================================================== */

const CONFIG = {
  /* Los valores llegan de config.js (despliegue público sobre PostgreSQL). */
  supabase: (window.CONFIG_SUPABASE || { url: "", anonKey: "" })
};

const HORA_INI = 6, HORA_FIN = 21, FILA = 52;

/* ---------------------- utilidades ---------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "setiembre", "octubre", "noviembre", "diciembre"];
const DIA = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const DOW = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];

const iso = (d) => [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
const hoyISO = () => iso(new Date());
const aDate = (s) => { const [a, m, d] = String(s).split("-").map(Number); return new Date(a, m - 1, d); };
const suma = (s, n) => { const d = aDate(s); d.setDate(d.getDate() + n); return iso(d); };
const sumaMes = (s, n) => { const d = aDate(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); };
const lunes = (s) => suma(s, -(((aDate(s).getDay() + 6) % 7)));
const minutos = (h) => { const [a, b] = String(h || "00:00").split(":").map(Number); return (a || 0) * 60 + (b || 0); };
const hhmm = (h) => String(h || "").slice(0, 5);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(16).slice(2));
const listaP = (v) => Array.isArray(v) ? v.filter(Boolean) : (v ? [String(v)] : []);

function cargarScript(src) {
  return new Promise((ok, err) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => err(new Error("no se pudo cargar " + src));
    document.head.appendChild(s);
  });
}

/* ---------------------- datos de ejemplo (no se guardan) ---------------------- */
function ejemplo() {
  const l = lunes(hoyISO());
  const v = (d, hora, entidad, personas, obs) =>
    ({ id: uid(), fecha: suma(l, d), hora, entidad, personas, observaciones: obs || "" });
  return [
    v(0, "09:00", "Municipalidad Distrital de Santiago", ["J. Quispe", "L. Ramos"], "Coordinar con Secretaría General."),
    v(1, "10:30", "UGEL 06 Ate", ["J. Quispe"], ""),
    v(2, "09:00", "Hospital Regional de Ica", ["M. Flores"], "Llevar copia del expediente."),
    v(2, "15:00", "EPS Tacna S.A.", ["R. Vargas", "M. Flores"], ""),
    v(4, "11:00", "Municipalidad Provincial de Huaura", ["R. Vargas"], "Segunda visita de verificación.")
  ];
}

/* ---------------------- almacenes ---------------------- */
async function storeClaudeDb() {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) return null;
  const limpio = (o) => { const c = { ...o }; delete c.id; return c; };
  return {
    tipo: "db", etiqueta: "Base de datos en línea de la agenda",
    escucha(cb) {
      db.collection("visitas").onSnapshot(
        (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
        (e) => console.warn("db", e.code)
      );
    },
    async guardar(o) { await db.doc("visitas/" + o.id).set(limpio(o)); },
    async borrar(id) { await db.doc("visitas/" + id).delete(); },
    async probarEdicion() { try { await db.doc("meta/acceso").set({ ts: Date.now() }); return true; } catch (e) { return false; } }
  };
}

async function storeSupabase(cfg) {
  await cargarScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  let alCambiar = null;
  const deFila = (r) => ({ ...r, hora: hhmm(r.hora), personas: listaP(r.personas), observaciones: r.observaciones || "" });
  const leer = async () => {
    const { data, error } = await sb.from("visitas").select("*");
    if (error) { console.warn(error.message); return []; }
    return (data || []).map(deFila);
  };
  return {
    tipo: "supabase", etiqueta: "PostgreSQL (Supabase)", cliente: sb,
    escucha(cb) {
      alCambiar = cb;
      const refrescar = async () => cb(await leer());
      refrescar();
      sb.channel("visitas").on("postgres_changes", { event: "*", schema: "public", table: "visitas" }, refrescar).subscribe();
    },
    async guardar(o) { const { error } = await sb.from("visitas").upsert(o); if (error) throw error; if (alCambiar) alCambiar(await leer()); },
    async borrar(id) { const { error } = await sb.from("visitas").delete().eq("id", id); if (error) throw error; if (alCambiar) alCambiar(await leer()); },
    async probarEdicion() {
      const { data } = await sb.auth.getSession();
      const correo = data && data.session && data.session.user ? data.session.user.email : null;
      if (!correo) return "sesion";
      const { data: eds } = await sb.from("editores").select("email");
      return !!eds && eds.some((r) => (r.email || "").toLowerCase() === correo.toLowerCase());
    }
  };
}

function storeLocal() {
  const CLAVE = "agenda-inspecciones-v1";
  let cache = [];
  try { cache = JSON.parse(localStorage.getItem(CLAVE) || "[]"); } catch (e) {}
  let alCambiar = null;
  const persistir = () => { try { localStorage.setItem(CLAVE, JSON.stringify(cache)); } catch (e) {} };
  return {
    tipo: "local", etiqueta: "Este navegador (sin servidor)",
    escucha(cb) { alCambiar = cb; cb(cache.slice()); },
    async guardar(o) { const i = cache.findIndex((x) => x.id === o.id); if (i >= 0) cache[i] = o; else cache.push(o); persistir(); alCambiar(cache.slice()); },
    async borrar(id) { cache = cache.filter((x) => x.id !== id); persistir(); alCambiar(cache.slice()); },
    async probarEdicion() { return true; }
  };
}
</script>
<script>
/* ---------------------- estado ---------------------- */
const EJEMPLO = ejemplo();
const S = {
  reales: [], visitas: EJEMPLO, ejemplo: true,
  store: null, edicion: false,
  vista: "mes", cursor: hoyISO(), persona: "", hoy: hoyISO()
};

function aplicar(filas) {
  S.reales = filas;
  S.ejemplo = filas.length === 0;
  S.visitas = S.ejemplo ? EJEMPLO : filas;
  render();
}
const visibles = () => S.visitas
  .filter((v) => !S.persona || listaP(v.personas).includes(S.persona))
  .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
const personas = () => {
  const s = new Set(); S.visitas.forEach((v) => listaP(v.personas).forEach((p) => s.add(p)));
  return Array.from(s).sort((a, b) => a.localeCompare(b, "es"));
};
const entidades = () => Array.from(new Set(S.visitas.map((v) => v.entidad).filter(Boolean))).sort((a, b) => a.localeCompare(b, "es"));

/* ---------------------- render ---------------------- */
function render() {
  const evs = visibles();
  $("#rotulo").textContent = rotulo().replace(/^./, (c) => c.toUpperCase());
  $("#btn-edicion").textContent = S.edicion ? "Edición activa · salir" : "Activar edición";
  $("#btn-edicion").classList.toggle("activo", S.edicion);
  $("#btn-nueva").hidden = !S.edicion;

  const sel = $("#filtro-persona");
  const gente = personas();
  sel.innerHTML = '<option value="">Todas las personas</option>' + gente.map((p) => '<option value="' + esc(p) + '"' + (p === S.persona ? " selected" : "") + ">" + esc(p) + "</option>").join("");
  sel.classList.toggle("activo", !!S.persona);
  $("#lista-personas").innerHTML = gente.map((p) => '<option value="' + esc(p) + '"></option>').join("");
  $("#lista-entidades").innerHTML = entidades().map((e) => '<option value="' + esc(e) + '"></option>').join("");

  renderAviso();
  if (S.vista === "mes") renderMes(evs);
  else renderTiempo(evs, S.vista === "semana" ? Array.from({ length: 7 }, (_, i) => suma(lunes(S.cursor), i)) : [S.cursor]);

  $("#pie-fuente").textContent = "Datos: " + (S.store ? S.store.etiqueta : "cargando…");
  $("#pie-cuenta").textContent = evs.length + (evs.length === 1 ? " visita" : " visitas") + (S.persona ? " de " + S.persona : "") + " en total";
}

function rotulo() {
  const d = aDate(S.cursor);
  if (S.vista === "mes") return MES[d.getMonth()] + " " + d.getFullYear();
  if (S.vista === "dia") return DIA[d.getDay()] + " " + d.getDate() + " de " + MES[d.getMonth()];
  const l = aDate(lunes(S.cursor)), f = aDate(suma(lunes(S.cursor), 6));
  return l.getDate() + (l.getMonth() === f.getMonth() ? "" : " de " + MES[l.getMonth()]) + " – " + f.getDate() + " de " + MES[f.getMonth()] + " " + f.getFullYear();
}

function renderAviso() {
  const c = $("#aviso");
  if (S.ejemplo) {
    c.innerHTML = '<div class="aviso demo"><span><b>Datos de ejemplo.</b> Todavía no hay visitas programadas: estas son de muestra y desaparecen al crear la primera.</span></div>';
  } else if (S.store && S.store.tipo === "local") {
    c.innerHTML = '<div class="aviso"><span><b>Modo local.</b> La agenda se guarda solo en este navegador.</span></div>';
  } else c.innerHTML = "";
}

const chipEv = (v) => '<button class="ev" data-id="' + v.id + '" title="' + esc(v.entidad)
  + (listaP(v.personas).length ? " · " + esc(listaP(v.personas).join(", ")) : "") + '"><b>' + hhmm(v.hora) + "</b>" + esc(v.entidad) + "</button>";

function renderMes(evs) {
  const c = aDate(S.cursor), a = c.getFullYear(), m = c.getMonth();
  const ini = lunes(iso(new Date(a, m, 1)));
  const ultimo = new Date(a, m + 1, 0).getDate();
  const semanas = Math.ceil((((new Date(a, m, 1).getDay() + 6) % 7) + ultimo) / 7);
  const porDia = new Map();
  evs.forEach((v) => { if (!porDia.has(v.fecha)) porDia.set(v.fecha, []); porDia.get(v.fecha).push(v); });
  let celdas = "";
  for (let i = 0; i < semanas * 7; i++) {
    const f = suma(ini, i), d = aDate(f), lista = porDia.get(f) || [];
    celdas += '<div class="celda' + (d.getMonth() !== m ? " otro" : "") + (f === S.hoy ? " hoy" : "") + '" data-fecha="' + f + '">'
      + '<button class="num" data-ir="' + f + '">' + d.getDate() + "</button>"
      + lista.slice(0, 3).map(chipEv).join("")
      + (lista.length > 3 ? '<button class="mas" data-ir="' + f + '">+' + (lista.length - 3) + " más</button>" : "")
      + "</div>";
  }
  $("#lienzo").innerHTML = '<div class="dow">' + DOW.map((x) => "<span>" + x + "</span>").join("") + "</div>"
    + '<div class="mes">' + celdas + "</div>";
}

/* agrupa las visitas que se solapan para repartir el ancho de la columna */
function grupos(lista) {
  const out = []; let g = [];
  lista.forEach((e) => {
    if (g.length && e.min < Math.max.apply(null, g.map((x) => x.min + 60))) g.push(e);
    else { if (g.length) out.push(g); g = [e]; }
  });
  if (g.length) out.push(g);
  return out;
}

function renderTiempo(evs, dias) {
  const cols = "52px repeat(" + dias.length + ",1fr)";
  const cab = dias.map((f) => { const d = aDate(f);
    return '<button class="cab-dia' + (f === S.hoy ? " hoy" : "") + '" data-ir="' + f + '">'
      + '<span class="d">' + DOW[(d.getDay() + 6) % 7] + '</span><br><span class="n">' + d.getDate() + "</span></button>";
  }).join("");
  let etiquetas = "";
  for (let h = HORA_INI; h < HORA_FIN; h++) etiquetas += '<div class="hora-et">' + String(h).padStart(2, "0") + ":00</div>";

  const columnas = dias.map((f) => {
    const d = aDate(f);
    let franjas = "";
    for (let h = HORA_INI; h < HORA_FIN; h++) franjas += '<div class="franja" data-fecha="' + f + '" data-hora="' + String(h).padStart(2, "0") + ':00"></div>';
    const lista = evs.filter((v) => v.fecha === f).map((v) => ({ ...v, min: minutos(v.hora) })).sort((a, b) => a.min - b.min);
    let bloques = "";
    grupos(lista).forEach((g) => {
      g.forEach((v, i) => {
        const top = Math.max(0, (Math.min(Math.max(v.min, HORA_INI * 60), HORA_FIN * 60 - 30) - HORA_INI * 60) / 60 * FILA);
        const ancho = "calc((100% - 4px)/" + g.length + " - 2px)";
        const izq = "calc(2px + " + i + "*(100% - 4px)/" + g.length + ")";
        const gente = listaP(v.personas);
        const solo = dias.length === 1;
        bloques += '<button class="bloque" data-id="' + v.id + '" title="' + hhmm(v.hora) + " · " + esc(v.entidad) + (gente.length ? " · " + esc(gente.join(", ")) : "") + '" style="top:' + top + "px;height:" + (FILA - 3) + "px;left:" + izq + ";width:" + ancho + '">'
          + (solo
            ? '<div class="e"><span class="h">' + hhmm(v.hora) + "</span> " + esc(v.entidad) + "</div>"
            : '<div class="h">' + hhmm(v.hora) + '</div><div class="e">' + esc(v.entidad) + "</div>")
          + (gente.length ? '<div class="p">' + esc(gente.join(", ")) + "</div>" : "")
          + (solo && v.observaciones ? '<div class="p">' + esc(v.observaciones) + "</div>" : "")
          + "</button>";
      });
    });
    let ahora = "";
    if (f === S.hoy) {
      const n = new Date(), min = n.getHours() * 60 + n.getMinutes();
      if (min >= HORA_INI * 60 && min <= HORA_FIN * 60) ahora = '<div class="ahora" style="top:' + ((min - HORA_INI * 60) / 60 * FILA) + 'px"></div>';
    }
    return '<div class="col-dia' + (d.getDay() === 0 || d.getDay() === 6 ? " finde" : "") + '">' + franjas + bloques + ahora + "</div>";
  }).join("");

  $("#lienzo").innerHTML = '<div class="grid-scroll' + (dias.length === 1 ? " dia-detalle" : "") + '">'
    + '<div class="cabecera" style="grid-template-columns:' + cols + '"><div class="hueco"></div>' + cab + "</div>"
    + '<div class="horas" style="grid-template-columns:' + cols + '"><div class="col-horas">' + etiquetas + "</div>" + columnas + "</div></div>";
}

/* ---------------------- interacción ---------------------- */
function toast(msg) {
  let t = $("#toast");
  if (!t) {
    t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,420px);text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(() => { t.hidden = true; }, 3500);
}

/* campo de personas */
const cajaP = $("#f-personas");
function chipsRender() {
  const entrada = cajaP.querySelector("input");
  cajaP.querySelectorAll(".persona").forEach((n) => n.remove());
  (cajaP._val || []).forEach((p, i) => {
    const s = document.createElement("span");
    s.className = "persona"; s.textContent = p;
    if (S.edicion) {
      const x = document.createElement("button");
      x.type = "button"; x.className = "quita"; x.textContent = "×"; x.setAttribute("aria-label", "Quitar a " + p);
      x.onclick = () => { cajaP._val.splice(i, 1); chipsRender(); };
      s.appendChild(x);
    }
    cajaP.insertBefore(s, entrada);
  });
}
function chipsAdd(texto) {
  const v = String(texto || "").trim().replace(/[,;]+$/, "");
  if (!v) return;
  cajaP._val = cajaP._val || [];
  if (!cajaP._val.includes(v)) cajaP._val.push(v);
  cajaP.querySelector("input").value = ""; chipsRender();
}
const chipsGet = () => { const p = cajaP.querySelector("input").value.trim(); const v = (cajaP._val || []).slice(); if (p && !v.includes(p)) v.push(p); return v; };
(function initChips() {
  const i = cajaP.querySelector("input");
  i.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" || ev.key === "," || ev.key === ";") { ev.preventDefault(); chipsAdd(i.value); }
    else if (ev.key === "Backspace" && !i.value && (cajaP._val || []).length) { cajaP._val.pop(); chipsRender(); }
  });
  i.addEventListener("blur", () => chipsAdd(i.value));
  cajaP.addEventListener("click", (ev) => { if (ev.target === cajaP) i.focus(); });
})();

/* diálogo */
let editando = null;
function abrir(v, fecha, hora) {
  editando = v || null;
  const ro = !S.edicion;
  $("#dlg-titulo").textContent = v ? (ro ? "Visita programada" : "Editar visita") : "Nueva visita";
  $("#f-entidad").value = v ? v.entidad || "" : "";
  $("#f-fecha").value = v ? v.fecha || "" : (fecha || S.cursor);
  $("#f-hora").value = v ? hhmm(v.hora) : (hora || "09:00");
  $("#f-obs").value = v ? v.observaciones || "" : "";
  cajaP._val = v ? listaP(v.personas).slice() : [];
  cajaP.querySelector("input").value = "";
  chipsRender();
  ["#f-entidad", "#f-fecha", "#f-hora", "#f-obs"].forEach((s) => { $(s).readOnly = ro; $(s).disabled = ro && $(s).tagName === "SELECT"; });
  cajaP.querySelector("input").hidden = ro;
  $("#f-eliminar").hidden = ro || !v;
  $("#form").querySelector('button[type="submit"]').hidden = ro;
  $("#f-cancelar").textContent = ro ? "Cerrar" : "Cancelar";
  $("#dlg").showModal();
}
$("#f-cancelar").addEventListener("click", () => $("#dlg").close());
$("#form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (!S.edicion) return $("#dlg").close();
  const o = {
    id: editando ? editando.id : uid(),
    entidad: $("#f-entidad").value.trim(),
    fecha: $("#f-fecha").value,
    hora: $("#f-hora").value,
    personas: chipsGet(),
    observaciones: $("#f-obs").value.trim()
  };
  if (!o.entidad || !o.fecha || !o.hora) return;
  try { await S.store.guardar(o); $("#dlg").close(); toast("Visita guardada."); }
  catch (e) { toast("No se pudo guardar: " + (e.message || e.code)); }
});
$("#f-eliminar").addEventListener("click", async () => {
  if (!editando || !confirm("¿Eliminar la visita a " + editando.entidad + "?")) return;
  try { await S.store.borrar(editando.id); $("#dlg").close(); toast("Visita eliminada."); }
  catch (e) { toast("No se pudo eliminar: " + (e.message || e.code)); }
});

/* clics en el calendario */
$("#lienzo").addEventListener("click", (ev) => {
  const ir = ev.target.closest("[data-ir]");
  if (ir) { S.cursor = ir.dataset.ir; S.vista = "dia"; sincronizarVistas(); render(); return; }
  const b = ev.target.closest("[data-id]");
  if (b) { const v = S.visitas.find((x) => x.id === b.dataset.id); if (v) abrir(v); return; }
  if (!S.edicion) return;
  if (S.ejemplo && !S.reales.length) { /* crear la primera visita reemplaza el ejemplo */ }
  const fr = ev.target.closest(".franja");
  if (fr) return abrir(null, fr.dataset.fecha, fr.dataset.hora);
  const celda = ev.target.closest(".celda");
  if (celda) return abrir(null, celda.dataset.fecha, "09:00");
});

/* barra superior */
function sincronizarVistas() { $$(".vistas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vista === S.vista))); }
$$(".vistas button").forEach((b) => b.addEventListener("click", () => { S.vista = b.dataset.vista; sincronizarVistas(); render(); }));
$("#btn-hoy").addEventListener("click", () => { S.cursor = hoyISO(); render(); });
$("#btn-ant").addEventListener("click", () => { S.cursor = S.vista === "mes" ? sumaMes(S.cursor, -1) : suma(S.cursor, S.vista === "semana" ? -7 : -1); render(); });
$("#btn-sig").addEventListener("click", () => { S.cursor = S.vista === "mes" ? sumaMes(S.cursor, 1) : suma(S.cursor, S.vista === "semana" ? 7 : 1); render(); });
$("#filtro-persona").addEventListener("change", (e) => { S.persona = e.target.value; render(); });
$("#btn-nueva").addEventListener("click", () => abrir(null, S.vista === "mes" ? S.cursor : S.cursor, "09:00"));
$("#btn-edicion").addEventListener("click", async () => {
  if (S.edicion) { S.edicion = false; render(); return; }
  if (!S.store) return;
  const b = $("#btn-edicion"); b.disabled = true; b.textContent = "Verificando…";
  let r = false;
  try { r = await S.store.probarEdicion(); } catch (e) { r = false; }
  b.disabled = false;
  if (r === "sesion") {
    const correo = prompt("Ingresa tu correo autorizado. Recibirás un enlace de acceso.");
    if (correo) {
      const { error } = await S.store.cliente.auth.signInWithOtp({ email: correo.trim(), options: { emailRedirectTo: location.href } });
      toast(error ? "No se pudo enviar el enlace: " + error.message : "Enlace enviado a " + correo.trim() + ".");
    }
    render(); return;
  }
  S.edicion = r === true;
  if (!S.edicion) toast("Tu acceso es de solo lectura.");
  render();
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest("input, textarea, select") || $("#dlg").open) return;
  if (ev.key === "m") { S.vista = "mes"; sincronizarVistas(); render(); }
  if (ev.key === "s") { S.vista = "semana"; sincronizarVistas(); render(); }
  if (ev.key === "d") { S.vista = "dia"; sincronizarVistas(); render(); }
});

/* ---------------------- arranque ---------------------- */
(async function iniciar() {
  if (window.matchMedia("(max-width: 640px)").matches) { S.vista = "dia"; sincronizarVistas(); }
  render();
  let store = null;
  if (CONFIG.supabase.url && CONFIG.supabase.anonKey) {
    try { store = await storeSupabase(CONFIG.supabase); } catch (e) { console.warn("Supabase no disponible:", e.message); }
  }
  if (!store) { try { store = await storeClaudeDb(); } catch (e) { console.warn(e); } }
  if (!store) store = storeLocal();
  S.store = store;
  store.escucha(aplicar);
  render();
})();
</script>
</body>
